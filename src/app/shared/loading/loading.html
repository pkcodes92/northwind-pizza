@if (isLoading$ | async) {
    <div class="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
        <div class="overlay-backdrop"></div>
        <div class="overlay-content" [attr.aria-busy]="true">
            <img src="assets/pizza-slices.gif" alt="Pizza Slices" class="loading-image"/>

            @if (message) {
                <div class="overlay-message">{{ (message$ | async ) || "Loading..."}}</div>
            }
        </div>
    </div>
}
