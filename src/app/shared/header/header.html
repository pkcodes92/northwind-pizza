<header class="app-header">
    <mat-toolbar>
        <button mat-icon-button type="button" [attr.aria-label]="menuLabel"
                [attr.aria-expanded]="drawerOpened"
                aria-controls="main-navigation"
                (click)="menuToggle.emit()">

            <mat-icon class="menu" [matTooltip]="!drawerOpened ? 'Open' : 'Close'">{{drawerOpened ? "close" : "menu"}}</mat-icon>
        </button>

        <a class="brand" routerLink="/home">Northwind Pizza</a>

        <a
            class="cart-action"
            mat-icon-button
            routerLink="/cart"
            [attr.aria-label]="cartLabel"
            [matBadge]="cartService.itemCount()"
            [matBadgeHidden]="cartService.itemCount() === 0"
            matBadgeColor="warn"
            matBadgeSize="small"
            matTooltip="View Your Cart">
            <mat-icon>shopping_cart</mat-icon>
        </a>
    </mat-toolbar>
</header>
